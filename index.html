td {
  text-align: center;
}

.diff {
  font-size: 0.7em;
}

.plus {
  background-color: #82e982;
}
.minus {
  background-color: #ff8b8b;
}

<body>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dom-to-image/2.6.0/dom-to-image.min.js">
</script>
<div id="aaaa" style='display: inline-block; max-width: 100%;'>
    <table>
        <thead>
            <tr style="background: #c9c9c9;">
                <td id="time">
                </td>
                <td >
                    <div class="i z">
                    </div>
                </td>
                <td >
                    <div class="i b">
                    </div>
                </td>
                <td >
                    <div class="i s">
                    </div>
                </td>
                <td >
                    <div class="i k">
                    </div>
                </td>
                <td >
                    <div class="i t">
                    </div>
                </td>
            </tr>
        </thead>
        <tbody id="tbody">
        </tbody>
    </table>
</div>

<br>
<input type="submit" onclick="image()" value="Скачать картинку">
<div id="show_img"></div>

<div>
    <h3>
        Ввод новых данных
    </h3>
</div>
<table>
    <thead>
        <tr  style="background: #c9c9c9;">
            <td>
            </td>
            <td >
                <div class="i z">
                </div>
            </td>
            <td >
                <div class="i b">
                </div>
            </td>
            <td >
                <div class="i s">
                </div>
            </td>
            <td >
                <div class="i k">
                </div>
            </td>
            <td >
                <div class="i t">
                </div>
            </td>
        </tr>
    </thead>
    <tbody id="tbody_new">
    </tbody>
    <tfoot>
        <tr>
            <td colspan=9999 style="text-align: right">
                <input style="margin-top: 5px;" type="submit" onclick="saveValues()" value="Сохранить данные">
            </td>
        </tr>
    </tfoot>
</table>

<div style="margin-top: 20px">
    <h3>
        Список задротов
    </h3>
    <form id="new" onsubmit="saveAccounts(); return false;">
    </form>
</div>

<div style="margin-top: 20px">
    <h3>
        Настройки
    </h3>
  <label>Копим на лимитку?</label>
  <input type="checkbox" id="limitka">
  <br>
  <label>Сколько копим библетиков? (0 - не копим)</label>
  <input type="text" id="bibletiki">
</div>
<script>

const types = ['z', 'b', 's', 'k', 't'];

function set(k, v){
  localStorage.setItem(k, v);
}

function get(k,d = null){
  let v = localStorage.getItem(k);
  if(v === null) return d;
  return v;
}

function id(v){
  return document.getElementById(v);
}

function insert(e, h){
  e.insertAdjacentHTML('beforeend', h);
}

function build(){
  
  let LIMITKA = parseInt(get('limitka', 1));
  let BIBLETIKI = parseInt(get('bibletiki', 500)) || 500;
  
  id('time').innerHTML = get('time', '').replace(',', "<br>");
  
  let accounts = JSON.parse(get('accounts', '[]'));
  
  let tbody = id('tbody');
  let tbody_new = id('tbody_new');
 
  tbody.innerHTML = '';
  tbody_new.innerHTML = '';
  
  for(let k in accounts){
    let v = accounts[k];
    let tr = '';
    tr += `<td>${v}</td>`;
    for(let type of types){
      let classDiff =  get(`classDiff_${k}_${type}`, '');
      let current = get(`current_${k}_${type}`, '-');
      let diff = Number(parseFloat(get(`diff_${k}_${type}`, '0')).toFixed(2));
      if(diff > 0) diff = `+${diff}`
      tr += `<td class="${classDiff}"><div class="cur">${current}</div><div class="diff">${diff}</div></td>`;
    }
    insert(tbody, `<tr>${tr}</tr>`);
    
    tr = '';
    tr += `<td>${v}</td>`;
    for(let type of types){
      tr += `<td><input type="text" value="" id="new_${k}_${type}" size=6></td>`;
    }
    insert(tbody_new, `<tr>${tr}</tr>`);
    
    let percent;
    
    if(LIMITKA){
		percent = getProgressPercent(get(`current_${k}_z`)*1000.0, 108000);
      	insert(tbody, `<tr><td colspan="9999" style="border: none;"><div class="progress" data-label="Лимитка ${percent}"><span class="value" style="width:${percent};"></span></div></td>`);
    }

    if(BIBLETIKI > 0){
      let bb = get(`current_${k}_b`);
      percent = getProgressPercent(bb, BIBLETIKI);
      insert(tbody, `<tr><td colspan="9999" style="border: none;"><div class="progress" data-label="Собрано ${bb} из ${BIBLETIKI} билетов (${percent})"><span class="value" style="width:${percent};"></span></div></td>`);
    }
    
    id("limitka").checked = LIMITKA;
    id("bibletiki").value = BIBLETIKI;
  }
  
  let f = id('new');
  f.innerHTML = '';
  for(let k in accounts){
    let v = accounts[k];
    insert(f, `<div class="zadrot"><input type="text" name="acc[${k}]" value='${v}'></div>`);
  }
  insert(f, '<div class="zadrot"><input type="text" name="acc[]" value=""></div><input type="submit" value="Сохранить">');
}

document.addEventListener("DOMContentLoaded", function(){
  build();
  id("limitka").addEventListener('change', (event) => {
    set('limitka', event.target.checked ? 1 : 0);
    build();
  });
  id("bibletiki").addEventListener('change', (event) => {
    set('bibletiki', parseInt(event.target.value) || 0);
    build();
  });
  
});


function getProgressPercent(current, total, decimals = 2) {
  if (total === 0) return "0%";
  return Math.min(((current / total) * 100), 100).toFixed(decimals) + "%";
}

function saveValues(){
  let accounts = JSON.parse(get('accounts', '[]'));
  for(let k in accounts){
    for(let type of types){
      let v = id(`new_${k}_${type}`).value;
      if(v == ''){
        alert('Заполни все значения');
        return;
      }
      v = v.replace(',', '.');
      if(isNaN(parseFloat(v))){
        alert('Заполни все значения');
        return;
      }
    }
  }
  for(let k in accounts){
    for(let type of types){
      let current = parseFloat(get(`current_${k}_${type}`, '0'));
      let v = parseFloat(id(`new_${k}_${type}`).value.replace(',', '.'));
      let diff = v - current;
      let classDiff = '';
      if(diff > 0) classDiff = 'plus'; 
      if(diff < 0) classDiff = 'minus'; 
      set(`classDiff_${k}_${type}`, classDiff);
      set(`diff_${k}_${type}`, diff);
      set(`current_${k}_${type}`, v);
    }
  }
  set('time', new Date().toLocaleString('ru-RU', {
      timeZone: 'Europe/Moscow',
      hourCycle: 'h23',
      year: "numeric",
      month: "2-digit",
      day: "2-digit",
      hour: "2-digit",
      minute: "2-digit",
      second: "2-digit"
  }));
  build();
  image();
}

function image(){
	let domNode = id('aaaa');
	let scale = 2;
	domtoimage.toPng(domNode, {
		width: domNode.clientWidth * scale,
		height: domNode.clientHeight * scale,
		style: {
			transform: 'scale('+scale+')',
			transformOrigin: 'top left'
		}
    }).then(url => {
    let img = new Image();
    img.src = url;
    id('show_img').innerHTML = '';
    id('show_img').style.display = '';
    id('show_img').appendChild(img);
    
    let link = document.createElement("a");
	let now = new Date();
	let offsetMs = now.getTimezoneOffset() * 60 * 1000;
	let dateLocal = new Date(now.getTime() - offsetMs);
	let str = dateLocal.toISOString().slice(0, 19).replace(/-/g, "/").replace("T", " ");
    
    link.download = 'Отчёт_'+str+".png";
    link.href = url;
    link.click();
  });
}

function saveAccounts(){
  let a = [];
  for(let v of Object.values(Object.fromEntries(new FormData(id('new'))))){
    if(v != '') a.push(v); 
  }
  set('accounts', JSON.stringify(a));
  build();
}

</script>
</body>
</html>
